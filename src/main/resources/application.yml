spring:
  application:
    name: deculto
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deculto_dev}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
  mvc:
    throw-exception-if-no-handler-found: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

tmdb:
  api:
    key: ${TMDB_API_KEY:}
